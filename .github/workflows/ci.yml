name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKFLOW_REQUIRE_GOLANGCI_LINT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          mkdir -p "${RUNNER_TEMP}/codex-workflow-tools"
          GOBIN="${RUNNER_TEMP}/codex-workflow-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          GOBIN="${RUNNER_TEMP}/codex-workflow-tools" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "${RUNNER_TEMP}/codex-workflow-tools" >> "${GITHUB_PATH}"
      - name: Verify release metadata
        run: bash scripts/verify-release.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Run actionlint
        run: actionlint .github/workflows/ci.yml
      - name: Report Go lint version
        run: golangci-lint version
      - name: Run workflow smoke test
        run: bash tests/workflow-smoke.sh
