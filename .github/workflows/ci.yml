name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  workflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify release metadata
        run: bash scripts/verify-release.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Run actionlint
        run: actionlint .github/workflows/ci.yml
      - name: Run workflow smoke test
        run: bash tests/workflow-smoke.sh
